# Included from the server block. The password file stays outside the web root.
location = /data/visitors.json {
    auth_basic "Visitors";
    auth_basic_user_file /etc/nginx/btc-insights-visitors.htpasswd;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex" always;
}

location /visitors/ {
    auth_basic "Visitors";
    auth_basic_user_file /etc/nginx/btc-insights-visitors.htpasswd;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex" always;
}

access_log /var/log/nginx/access.log btc_insights;
