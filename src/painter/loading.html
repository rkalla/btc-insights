<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#6CB4FF" stroke-width="2"/><path d="M8 15L11 11L13.5 13L16.5 8.5" fill="none" stroke="#6CB4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 class="brand-name">Bitcoin dashboard</h1>
    <span class="brand-sep"></span>
    <span class="brand-sub">Read-only · one holder</span>
  </div>
  <div class="clocks">
    <span class="loading-bar loading-bar--clock"></span>
    <span class="loading-bar loading-bar--clock"></span>
    <a class="icon-btn" href="settings.html" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7H14M18 7H20M4 17H8M12 17H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg></a>
  </div>
</header>
<main aria-busy="true">
  <p class="clock-line"><span class="loading-bar loading-bar--line"></span></p>
  <section class="panel spectrum">
    <div class="rails">
      <div class="rail-group rail-group--coins">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--rail"></span>
      </div>
      <div class="rail-divider"></div>
      <div class="rail-group rail-group--cash">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--rail"></span>
      </div>
    </div>
    <span class="loading-bar loading-bar--note"></span>
  </section>
  <section class="row row-1">
    <article class="panel cash">
      <div class="loading-lines">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--posture"></span>
        <span class="loading-bar loading-bar--action"></span>
        <span class="loading-bar loading-bar--body"></span>
        <span class="loading-bar loading-bar--body loading-bar--short"></span>
      </div>
    </article>
    <div class="side">
      <article class="panel coins">
        <div class="loading-lines">
          <span class="loading-bar loading-bar--label"></span>
          <span class="loading-bar loading-bar--posture-sm"></span>
          <span class="loading-bar loading-bar--body loading-bar--short"></span>
        </div>
      </article>
      <article class="panel now">
        <div class="loading-lines">
          <span class="loading-bar loading-bar--label"></span>
          <span class="loading-bar loading-bar--spot"></span>
          <div class="stats">
            <span class="loading-bar loading-bar--stat"></span>
            <span class="loading-bar loading-bar--stat"></span>
          </div>
          <span class="loading-bar loading-bar--note"></span>
        </div>
      </article>
    </div>
  </section>
  <section class="row row-2">
    <figure class="panel chart">
      <div class="loading-lines">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--chart"></span>
      </div>
    </figure>
    <aside class="panel context">
      <div class="loading-lines">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--body"></span>
        <span class="loading-bar loading-bar--body loading-bar--short"></span>
        <span class="loading-bar loading-bar--note"></span>
      </div>
    </aside>
  </section>
  <section class="panel longview">
    <div class="lv-left">
      <div class="loading-lines">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--title"></span>
        <span class="loading-bar loading-bar--note"></span>
      </div>
    </div>
  </section>
  <section class="panel cycles">
    <div class="loading-lines">
      <span class="loading-bar loading-bar--label"></span>
      <span class="loading-bar loading-bar--title"></span>
      <span class="loading-bar loading-bar--rail"></span>
      <span class="loading-bar loading-bar--note"></span>
    </div>
  </section>
</main>
