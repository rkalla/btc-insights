<main aria-busy="true">
  <p class="clock-line"><span class="loading-bar loading-bar--line"></span></p>
  <section class="row row-1">
    <article class="panel cash">
      <div class="loading-lines">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--posture"></span>
        <span class="loading-bar loading-bar--action"></span>
        <span class="loading-bar loading-bar--body"></span>
        <span class="loading-bar loading-bar--body loading-bar--short"></span>
      </div>
    </article>
    <div class="side">
      <article class="panel coins">
        <div class="loading-lines">
          <span class="loading-bar loading-bar--label"></span>
          <span class="loading-bar loading-bar--posture-sm"></span>
          <span class="loading-bar loading-bar--body loading-bar--short"></span>
        </div>
      </article>
      <article class="panel now">
        <div class="loading-lines">
          <span class="loading-bar loading-bar--label"></span>
          <span class="loading-bar loading-bar--spot"></span>
          <div class="stats">
            <span class="loading-bar loading-bar--stat"></span>
            <span class="loading-bar loading-bar--stat"></span>
          </div>
          <span class="loading-bar loading-bar--note"></span>
        </div>
      </article>
    </div>
  </section>
  <section class="row row-2">
    <figure class="panel chart">
      <div class="loading-lines">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--chart"></span>
      </div>
    </figure>
    <aside class="panel context">
      <div class="loading-lines">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--body"></span>
        <span class="loading-bar loading-bar--body loading-bar--short"></span>
        <span class="loading-bar loading-bar--note"></span>
      </div>
    </aside>
  </section>
  <section class="panel longview">
    <div class="lv-left">
      <div class="loading-lines">
        <span class="loading-bar loading-bar--label"></span>
        <span class="loading-bar loading-bar--title"></span>
        <span class="loading-bar loading-bar--note"></span>
      </div>
    </div>
  </section>
  <section class="panel cycles">
    <div class="loading-lines">
      <span class="loading-bar loading-bar--label"></span>
      <span class="loading-bar loading-bar--title"></span>
      <span class="loading-bar loading-bar--rail"></span>
      <span class="loading-bar loading-bar--note"></span>
    </div>
  </section>
</main>
