<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This week · BTC Friday</title>
<!--
  BTC Friday · This week page · reference HTML (human-first revision)
  - Opens in this week's real state: Buy strongly, set by the Friday Sep 25, 2026 close.
  - The grey preview bar at the top is for the implementing session only. Do not ship it.
  - All copy comes from DECK below, which is the spec's copy deck. The spec wins on any conflict.
  - Times are shown in America/Phoenix so the sample matches the owner's view. The real app
    formats in the viewer's own time zone (omit timeZone). Try ?tz=Europe/London to see the
    midnight rule.
  - The app self-hosts Geist. This file links Google Fonts and falls back to system fonts.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F6F2; --card:#FFFFFF; --ink:#15171C; --ink-2:#4A505C; --ink-3:#5F6570;
  --line:#E4E2DC; --line-strong:#D6D3CB; --dot:#8A909B;
  --buy:#1F5ED6; --buy-ink:#1B4FB8; --buy-tint:#EAF1FD; --buy-line:#C9DAF8;
  --caution:#A5520E; --caution-ink:#8C4509; --caution-tint:#FBF1E6; --caution-line:#F0DCC4;
  --neutral:#4A505C; --neutral-tint:#EFEEEA;
  --font:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r-card:16px; --r-chip:999px; --r-well:12px;
  --page-x:16px; --card-pad:20px; --stack:16px;
}
@media (min-width:600px){ :root{ --page-x:24px; --card-pad:28px; --stack:20px; } }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
a{color:var(--buy-ink);text-underline-offset:3px}
a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--buy);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Preview bar (reference only, never ship) ---------- */
.devbar{background:#2B2F36;color:#E8EAED;font-size:13px;line-height:1.4;padding:8px var(--page-x)}
.devbar-inner{max-width:680px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.devbar strong{font-weight:600;color:#fff}
.devbar select{font:inherit;font-size:13px;height:30px;border-radius:6px;border:1px solid #5A606B;background:#1E2126;color:#fff;padding:0 6px;max-width:100%}
.devbar label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.devbar input{accent-color:#8AB4FF;width:16px;height:16px;margin:0}
.devbar .devnote{flex-basis:100%;color:#B9BEC7;font-size:12px}

/* ---------- Header ---------- */
.site{border-bottom:1px solid var(--line);background:var(--paper)}
.site-inner{max-width:680px;margin:0 auto;padding:0 var(--page-x);display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand gear" "tabs tabs";align-items:center}
.brand{grid-area:brand;display:inline-flex;align-items:center;gap:10px;height:56px;color:var(--ink);text-decoration:none;font-weight:700;font-size:19px;letter-spacing:-.01em;justify-self:start}
.brand-mark{width:22px;height:22px;border-radius:7px;background:var(--buy);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff}
.tabs{grid-area:tabs;display:flex;gap:4px;margin:0 -4px;padding:0;list-style:none}
.tabs a{display:inline-flex;align-items:center;height:44px;padding:0 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:16px;font-weight:500;position:relative}
.tabs a:hover{color:var(--ink);background:var(--neutral-tint)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ink)}
.gear{grid-area:gear;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;height:44px;padding:0 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:16px;font-weight:500}
.gear:hover{color:var(--ink);background:var(--neutral-tint)}
.gear-label{display:none}
@media (min-width:600px){
  .site-inner{grid-template-columns:auto 1fr auto;grid-template-areas:"brand tabs gear";height:64px}
  .tabs{margin:0 0 0 20px;align-self:stretch;align-items:stretch}
  .tabs a{height:auto;border-radius:0}
  .tabs a:hover{background:transparent}
  .gear-label{display:inline}
}

/* ---------- Page ---------- */
.page{max-width:680px;margin:0 auto;padding:18px var(--page-x) 48px;display:flex;flex-direction:column;gap:var(--stack)}
.meta{margin:0;font-size:14px;line-height:1.5;color:var(--ink-3)}
.meta b{font-weight:600;color:var(--ink-2)}
.meta a{color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--card-pad)}
.card h2{margin:0;font-size:20px;line-height:1.3;font-weight:650;letter-spacing:-.01em}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head h2{margin:0}

/* ---------- Verdict ---------- */
.verdict{padding-top:calc(var(--card-pad) + 2px)}
.stale{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;border-radius:var(--r-well);background:var(--caution-tint);border:1px solid var(--caution-line);color:var(--caution-ink);font-size:15px;font-weight:500}
.headline{margin:0;font-size:clamp(30px,7.4vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.sub{margin:10px 0 0;font-size:18px;line-height:1.45;color:var(--ink-2)}
.sub--note{display:flex;gap:8px;align-items:flex-start;font-size:16px;margin-top:8px}
.sub--note svg{flex:none;margin-top:3px}

.scale-wrap{margin:26px 0 0}
.scale{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.scale::before{content:"";position:absolute;left:10%;right:10%;top:13px;height:4px;border-radius:4px;background:linear-gradient(90deg,#EBCDAA 0%,#E6E3DC 50%,#BFD3F7 100%)}
.scale li{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.scale .dot{width:12px;height:12px;margin-top:9px;border-radius:50%;background:var(--card);border:2px solid var(--dot);position:relative;z-index:1}
.scale .lab{font-size:13px;line-height:1.25;color:var(--ink-3);padding:0 1px}
.scale li[aria-current="step"] .dot{width:30px;height:30px;margin-top:0;border:0;background:var(--tone);box-shadow:0 0 0 5px var(--tone-tint)}
.scale li[aria-current="step"] .dot::after{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}
.scale li[aria-current="step"] .lab{font-size:14.5px;font-weight:650;color:var(--tone-ink)}
.scale li[aria-current="step"]{margin-top:0}
.scale li:not([aria-current]) .lab{margin-top:9px}
.tone-buy{--tone:var(--buy);--tone-ink:var(--buy-ink);--tone-tint:var(--buy-tint)}
.tone-caution{--tone:var(--caution);--tone-ink:var(--caution-ink);--tone-tint:var(--caution-tint)}
.tone-neutral{--tone:var(--neutral);--tone-ink:var(--ink);--tone-tint:var(--neutral-tint)}
.scale-note{margin:12px 0 0;font-size:13.5px;color:var(--ink-3);text-align:center}
@media (min-width:600px){ .scale .lab{font-size:14px} .scale li[aria-current="step"] .lab{font-size:15px} }
@media (max-width:374px){ .scale-wrap{margin-left:-10px;margin-right:-10px} .scale .lab{font-size:12px} .scale li[aria-current="step"] .lab{font-size:13px} }

.track{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:16px;line-height:1.5;color:var(--ink-2)}
.track b{color:var(--ink);font-weight:650}

/* ---------- What to do ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-chip);font-size:14px;font-weight:600;white-space:nowrap}
.chip--deadline{background:var(--buy-tint);color:var(--buy-ink)}
.chip--deadline.tone-caution{background:var(--caution-tint);color:var(--caution-ink)}
.chip--until{background:var(--neutral-tint);color:var(--ink-2);font-weight:500}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:step}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;counter-increment:step;font-size:17px;line-height:1.5}
.steps li::before{content:counter(step);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:650;background:var(--tone-tint);color:var(--tone-ink);margin-top:-2px}
.steps strong{font-weight:650}
.steps strong.nw{white-space:nowrap}
.after{margin:14px 0 0 44px;font-size:15px;color:var(--ink-3)}
.callout{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;padding:12px 14px;border-radius:var(--r-well);background:var(--buy-tint);border:1px solid var(--buy-line);font-size:15.5px;color:var(--ink)}
.callout svg{flex:none;margin-top:2px}
.personal{margin:18px 0 0;padding-top:14px;border-top:1px dashed var(--line-strong);font-size:15px;color:var(--ink-3)}

/* ---------- Why ---------- */
.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.bullets li{position:relative;padding-left:22px;font-size:17px;line-height:1.55}
.bullets li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.bullets li.flag::before{background:var(--caution)}

/* ---------- Record ---------- */
.answer{margin:0 0 14px;font-size:17px}
.answer b{font-weight:650}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:520px){ .tiles{grid-template-columns:repeat(5,minmax(0,1fr))} }
.tile{border:1px solid var(--line);border-radius:var(--r-well);padding:10px 12px 12px;background:var(--card)}
.tile .yr{display:block;font-size:13.5px;color:var(--ink-3)}
.tile .val{display:block;margin-top:2px;font-size:22px;line-height:1.2;font-weight:700;color:var(--buy-ink);letter-spacing:-.01em}
.tile--open{border-style:dashed;border-color:var(--line-strong);background:var(--paper)}
.tile--open .val{font-size:15px;line-height:1.3;font-weight:600;color:var(--ink-2);margin-top:4px}
.tile-cap{margin:8px 0 0;font-size:13.5px;color:var(--ink-3)}
.record-body{margin:14px 0 0;font-size:16px;color:var(--ink-2)}

/* ---------- Risk ---------- */
.risk{background:var(--caution-tint);border-color:var(--caution-line)}
.risk .card-head{justify-content:flex-start;gap:10px;margin-bottom:10px}
.risk h2{color:var(--caution-ink)}
.risk p{margin:0;font-size:17px}
.risk p + p{margin-top:10px}
.risk strong{font-weight:650}

/* ---------- Price, evidence, footer ---------- */
.price{display:flex;flex-direction:column;gap:2px;padding:4px 2px}
.price-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.price-label{font-size:15px;color:var(--ink-2);font-weight:500}
.price-val{font-size:26px;font-weight:700;letter-spacing:-.015em}
.price-time{font-size:14px;color:var(--ink-3)}
.price-note{margin:2px 0 0;font-size:14px;color:var(--ink-3)}
.evidence{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px var(--card-pad);min-height:64px}
.evidence:hover{border-color:var(--line-strong);color:var(--ink)}
.evidence .t{display:block;font-weight:650;font-size:17px}
.evidence .s{display:block;font-size:14.5px;color:var(--ink-3);margin-top:2px}
.evidence svg{flex:none;color:var(--ink-2)}
.foot{border-top:1px solid var(--line);margin-top:8px}
.foot-inner{max-width:680px;margin:0 auto;padding:22px var(--page-x) 40px;font-size:14px;line-height:1.55;color:var(--ink-3)}
.foot-inner p{margin:0 0 10px}
.foot-links{display:flex;gap:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const DECK = {"states": [{"id": "ALL_IN", "engine": "ALL_IN", "step": "Buy strongly", "tone": "buy", "label": "Buy strongly", "headline": "A strong week to buy Bitcoin.", "coins": "Keep any Bitcoin you already own.", "recordLine": "Worked all {wins} times before, but {wins} is a small number.", "timing": "deadline", "todo": ["Put {amount} into Bitcoin by {deadline} your time.", "Keep your regular buys going{regularNote}."], "todoAfter": "After that, this page switches to the next week's advice.", "why": ["On {fireDate}, our strongest buy signal turned on. Before this, it had turned on only {total} times: in {fireYears}.", "Bitcoin is about {gap}% below its long-run trend. When it has been 20% or more below, it was higher a year later about 19 times in 20."], "record": {"answer": "Yes, all {wins} times.", "tiles": true, "caption": "Bitcoin's price one year after each signal.", "body": "That's too few to be sure. Allowing for that, a cautious estimate is that it works about {inTen} times in 10 or better. Treat it as a strong hint, not a promise."}, "risk": ["After past signals like this, Bitcoin still dropped as much as {worstDip}% below its signal-day price at some point in the next year. It has fallen 20% or more at some point in every year since 2012."]}, {"id": "LUMP_IN", "engine": "LUMP_IN", "step": "Add", "tone": "buy", "label": "Add (at once)", "headline": "A good time to add to Bitcoin.", "coins": "Keep any Bitcoin you already own.", "recordLine": "Worked in all {wins} past stretches like this.", "timing": "until", "todo": ["Put {amount} into Bitcoin when you have it. There's no need to spread it out.", "Keep your regular buys going{regularNote}."], "todoAfter": null, "why": ["Bitcoin is about {gap}% below its long-run trend. When it has been 20% or more below, it was higher a year later about 19 times in 20.", "In stretches like this, putting money in all at once beat spreading it over a year in all {wins} past cases."], "record": {"answer": "Yes, in all {wins} past stretches.", "tiles": false, "caption": null, "body": "That's still a small number. Allowing for that, a cautious estimate is that it works about {inTen} times in 10 or better. This stretch began in {stretchStart} and hasn't finished yet."}, "risk": ["Bitcoin can keep falling after you buy. It has fallen 20% or more at some point in every year since 2012."]}, {"id": "BUILD", "engine": "BUILD", "step": "Add", "tone": "buy", "label": "Add (each week)", "headline": "Bitcoin is cheap. Add a little each week.", "coins": "Keep any Bitcoin you already own.", "recordLine": "Bitcoin was higher a year later in {weeksUp} of {weeks} weeks like this.", "timing": "until", "todo": ["Add {slice} to Bitcoin this week, and each week while it stays this cheap.", "Keep your regular buys going{regularNote}."], "todoAfter": null, "why": ["Bitcoin is trading below what the average holder paid for it. Before now, that had happened in only {stretches} stretches since 2012.", "In those stretches, Bitcoin was higher a year later in {weeksUp} of {weeks} weeks."], "record": {"answer": "Yes, in {weeksUp} of {weeks} weeks.", "tiles": false, "caption": null, "body": "Those weeks came from only {stretches} stretches, and weeks close together tend to move together. So think of it as {stretches} examples, not {weeks}."}, "risk": ["Cheap can get cheaper. In past stretches, the price sometimes kept falling for months before it turned. Adding a little each week spreads that risk out."]}, {"id": "STAY", "engine": "STAY", "step": "Steady", "tone": "neutral", "label": "Steady", "headline": "A normal week. Keep your regular buys.", "coins": "Keep any Bitcoin you already own.", "recordLine": "None needed. This is the normal plan.", "timing": "until", "todo": ["Keep your regular buys going{regularNote}.", "Have new money to invest? History shows no clear winner in weeks like this, so put it in now or spread it out, whichever you prefer."], "todoAfter": null, "why": ["Bitcoin is {gapWords} its long-run r got more Bitcoin for the same money in {wins} of {total} cases."], "record": {"answer": "{wins} of {total} times.", "tiles": false, "caption": null, "body": "In June 2013, pausing missed a large rise. The signal also stayed off before two big drops, in 2019–20 and 2025–26. And a 12-month pause hasn't been tested on its own."}, "risk": ["Pausing can mean buying back at a higher price. In 2013, it meant missing a large rise."]}, {"id": "EXIT", "engine": "NO_NEW_BUY + EXIT", "step": "Pause", "tone": "caution", "label": "Sell (your decision)", "headline": "Stop buying, and sell your Bitcoin.", "coins": "You've told us Bitcoin's long-term case is broken.", "recordLine": "None. This follows your decision, not a market signal.", "timing": "none", "todo": ["Sell the Bitcoin you hold. Selling can create a tax bill, so check with a tax adviser first.", "Stop new buys, including your regular ones."], "todoAfter": null, "why": ["On {declaredDate}, you said in Settings that you no longer believe in Bitcoin's long-term case."], "record": {"answer": "There's no record for this.", "tiles": false, "caption": null, "body": "It's your decision, not a signal, so there's nothing to test."}, "risk": ["If you change your mind, you may buy back at a higher price. You can undo this in Settings."], "noRiskStrong": true}, {"id": "NO_CALL", "engine": "NO_CALL", "step": null, "tone": null, "label": "No update", "headline": "No update this week.", "coins": "Keep any Bitcoin you already own.", "recordLine": null, "timing": "none", "todo": ["Keep your regular buys going{regularNote}.", "Check back later. We'll update as soon as the data comes through."], "todoAfter": null, "why": ["This week's price data didn't arrive, or it failed our checks. We won't guess."], "record": null, "risk": ["Bitcoin can fall 20% or more at any time. It has, at some point, in every year since 2012."]}], "modifiers": {"armed": {"when": "The engine reports the strongest buy signal as set up but not yet on (armed), and the state isn't ALL_IN.", "todoNote": "Our strongest buy signal is getting close. Keep some extra cash ready for it.", "why": "Bitcoin has fallen far enough against gold, and below its trend, to set up our strongest buy signal. It turns on when Bitcoin's price in gold climbs back to its one-year average."}, "gold": {"when": "goldAssisted is true (the gold flag).", "why": "Part of this signal came from gold rising, not only Bitcoin falling, so it's a little weaker than usual."}, "trim": {"when": "Settings has coins, investments, a target and a limit, and Bitcoin's share is above the limit. Not shown with the Sell state.", "coins": "Take some profit: sell part of your Bitcoin.", "todo": "Sell about {trimUsd} of Bitcoin (about {trimBtc} bitcoin) to get back to {target}% of your investments. Sell the coins that cost you the most first. Selling can create a tax bill.", "todoPause": "Finish by {pauseEnds}.", "why": "Bitcoin has grown to {share}% of your investments, above the {ceiling}% limit you set."}, "overridesPause": {"when": "ALL_IN or BUILD while a pause from the caution signal is still running.", "sub": "An earlier signal said to pause. This week's buy signal replaces it.", "regular": "Restart your regular buys{regularNote}."}, "stale": {"when": "No new data 6 hours after the expected update, or the engine sets stale.", "banner": "This page hasn't updated since {updated}. Don't act on it until it does."}}, "common": {"riskStrong": "Only use money you won't need for a few years.", "scaleNote": "This shows what to do, not how sure we are.", "trackLabel": "Track record:", "untilChip": "Holds until {nextUpdateShort}", "untilLine": "This advice holds until the next update on {nextUpdate}.", "personalise": "Want this in dollars? Add the amount you've set aside in Settings. It stays on this device.", "priceNote": "Prices move every day. The advice only changes on Fridays.", "shortDisclaimer": "Research, not personal financial advice.", "footer": "BTC Friday is research, not personal financial advice. It looks at Bitcoin's price history, and history can be wrong about the future. It doesn't know your full situation, doesn't trade for you and doesn't calculate taxes. Before investing money you can't afford to lose, talk to a fee-only financial adviser.", "evidenceLink": "See the evidence behind this", "updateLine": "This week's advice, set {updatedShort}. Next update {nextUpdate} your time."}};

/* ---------- Sample facts (the engine supplies these in plain.*) ---------- */
const params = new URLSearchParams(location.search);
const TZ = params.get('tz') || 'America/Phoenix';      // app: the viewer's zone (omit timeZone)
const NOW = new Date('2026-09-27T21:14:00Z');           // sample "now": Sun Sep 27, 2:14 pm Phoenix
const BASE = { updatedUtc:'2026-09-26T00:00:00Z', nextUpdateUtc:'2026-10-03T00:00:00Z',
               latestPriceUsd:84207, latestPriceUtc:'2026-09-27T21:14:00Z' };
const FACTS = {
  ALL_IN:{ deadlineUtc:'2026-10-03T00:00:00Z', fireDate:'2026-09-18', gapPctFriday:-41,
           record:{wins:4,total:4,floorPct:59.6}, worstDip:27, goldAssisted:true,
           history:[{year:2015,pct:127},{year:2019,pct:59},{year:2020,pct:269},{year:2023,pct:138},{year:2026,pct:null,date:'2026-09-18'}] },
  LUMP_IN:{ gapPctFriday:-32, record:{wins:6,total:6,floorPct:68.9}, stretchStart:'November 2025' },
  BUILD:{ gapPctFriday:-52, record:{weeksUp:90,weeks:91,stretches:4} },
  STAY:{ gapPctFriday:-8 },
  SLOW_IN:{ gapPctFriday:62, record:{wins:2,total:3,floorPct:25.3} },
  STAND_DOWN:{ gapPctFriday:38, record:{wins:7,total:8,floorPct:58.9}, pauseDate:'2026-03-06', pauseEnds:'2027-03-06' },
  EXIT:{ gapPctFriday:-41, declaredDate:'2026-09-01' },
  NO_CALL:{}
};
const SETTINGS_SAMPLE = { amount:'$10,000', regularNote:' ($200 a week)', slice:'$2,500',
  target:10, ceiling:15, share:18, trimUsd:'$37,400', trimBtc:'0.44' };
const BLANK = { amount:"the money you've set aside", regularNote:'', slice:'a small, fixed amount' };

/* ---------- Formatting ---------- */
const parts = (d, opts) => Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,...opts}).formatToParts(d).map(p=>[p.type,p.value]));
function when(iso){                     // "Friday, Oct 2, 5:00 pm"; 00:00 local reads "Friday, Oct 2 at midnight"
  let d = new Date(iso);
  const hm = parts(d,{hour:'numeric',minute:'2-digit',hourCycle:'h23'});
  if (+hm.hour === 0 && +hm.minute === 0){
    const prev = new Date(d.getTime() - 60000);
    const p = parts(prev,{weekday:'long',month:'short',day:'numeric'});
    return `${p.weekday}, ${p.month} ${p.day} at midnight`;
  }
  const p = parts(d,{weekday:'long',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  return `${p.weekday}, ${p.month} ${p.day}, ${p.hour}:${p.minute} ${p.dayPeriod.toLowerCase()}`;
}
function dayLong(iso){ const p=parts(new Date(iso),{weekday:'long',month:'short',day:'numeric'}); return `${p.weekday}, ${p.month} ${p.day}`; }
function dayShort(iso){ const p=parts(new Date(iso),{weekday:'short',month:'short',day:'numeric'}); return `${p.weekday}, ${p.month} ${p.day}`; }
function md(isoDate){ const d=new Date(isoDate+'T12:00:00Z'); return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:'UTC'}).format(d); }
function mdy(isoDate){ const d=new Date(isoDate+'T12:00:00Z'); return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}).format(d); }
function localYMD(d){ const p=parts(d,{year:'numeric',month:'2-digit',day:'2-digit'}); return Date.UTC(+p.year,+p.month-1,+p.day); }
function daysLeft(iso){
  // A deadline at local midnight belongs to the day before it.
  const dl = new Date(new Date(iso).getTime() - 60000);
  const n = Math.round((localYMD(dl) - localYMD(NOW)) / 864e5);
  return n <= 0 ? 'Due today' : n === 1 ? '1 day left' : `${n} days left`;
}
const usd = n => '$' + Math.round(n).toLocaleString('en-US');
function gapWords(g){ const a=Math.abs(Math.round(g)); return g < 0 ? `about ${a}% below` : `about ${a}% above`; }
function listYears(ys){ return ys.length < 2 ? ys.join('') : ys.slice(0,-1).join(', ') + ' and ' + ys[ys.length-1]; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STRONG = new Set(['amount','deadline','slice','pauseEnds','trimUsd']);
function fill(t, v){
  return esc(t).replace(/\{(\w+)\}/g, (m,k) => {
    if (!(k in v)) return m;
    const val = esc(v[k]);
    return STRONG.has(k) && val.trim() ? `<strong${k === 'deadline' ? ' class="nw"' : ''}>${val}</strong>` : val;
  });
}

/* ---------- Icons ---------- */
const ICON = {
  warn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A5520E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B4FB8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  info:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  arrow:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};
const STEPS = [['Pause','caution'],['Go slow','caution'],['Steady','neutral'],['Add','buy'],['Buy strongly','buy']];

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
function render(){
  const id = $('dev-state').value;
  const s = DECK.states.find(x => x.id === id);
  const f = FACTS[id] || {};
  const amounts = $('dev-amounts').checked;
  const trim = $('dev-trim').checked && id !== 'EXIT' && id !== 'NO_CALL';
  const armed = $('dev-armed').checked && ['LUMP_IN','BUILD','STAY'].includes(id);
  const override = $('dev-override').checked && ['ALL_IN','BUILD'].includes(id);
  const stale = $('dev-stale').checked;
  const C = DECK.common, M = DECK.modifiers;
  const r = f.record || {};
  const v = Object.assign({}, amounts ? SETTINGS_SAMPLE : BLANK, {
    deadline: f.deadlineUtc ? when(f.deadlineUtc) : '',
    daysLeft: f.deadlineUtc ? daysLeft(f.deadlineUtc) : '',
    nextUpdate: when(BASE.nextUpdateUtc), nextUpdateShort: dayShort(BASE.nextUpdateUtc),
    updated: when(BASE.updatedUtc), updatedShort: dayLong(BASE.updatedUtc),
    gap: f.gapPctFriday != null ? Math.abs(Math.round(f.gapPctFriday)) : '',
    gapWords: f.gapPctFriday != null ? gapWords(f.gapPctFriday) : '',
    fireDate: f.fireDate ? md(f.fireDate) : '', pauseDate: f.pauseDate ? md(f.pauseDate) : '',
    pauseEnds: f.pauseEnds ? mdy(f.pauseEnds) : '', declaredDate: f.declaredDate ? md(f.declaredDate) : '',
    stretchStart: f.stretchStart || '', worstDip: f.worstDip || '',
    fireYears: f.history ? listYears(f.history.filter(h => h.pct != null).map(h => h.year)) : '',
    wins: r.wins, total: r.total, inTen: r.floorPct != null ? Math.round(r.floorPct/10) : '',
    weeksUp: r.weeksUp, weeks: r.weeks, stretches: r.stretches
  });
  if (!amounts){ Object.assign(v, {target:SETTINGS_SAMPLE.target, ceiling:SETTINGS_SAMPLE.ceiling, share:SETTINGS_SAMPLE.share, trimUsd:SETTINGS_SAMPLE.trimUsd, trimBtc:SETTINGS_SAMPLE.trimBtc}); }
  const tone = s.tone || 'neutral';
  const H = [];

  H.push(`<p class="meta">${stale ? '' : fill(C.updateLine, v) + '<br>'}${esc(C.shortDisclaimer)} <a href="#about">Read more</a></p>`);

  // Verdict
  H.push(`<section class="card verdict tone-${tone}" aria-labelledby="headline">`);
  if (stale) H.push(`<p class="stale" role="status">${ICON.warn}<span>${fill(M.stale.banner, v)}</span></p>`);
  H.push(`<h1 class="headline" id="headline">${fill(s.headline, v)}</h1>`);
  H.push(`<p class="sub">${fill(trim ? M.trim.coins : s.coins, v)}</p>`);
  if (override) H.push(`<p class="sub sub--note">${ICON.info}<span>${fill(M.overridesPause.sub, v)}</span></p>`);
  H.push(`<div class="scale-wrap"><ol class="scale" aria-label="Advice scale, from most cautious to most eager">`);
  for (const [name, t] of STEPS){
    const cur = s.step === name;
    H.push(`<li class="tone-${t}"${cur ? ' aria-current="step"' : ''}><span class="dot" aria-hidden="true"></span><span class="lab">${name}${cur ? '<span class="sr-only"> (this week)</span>' : ''}</span></li>`);
  }
  H.push(`</ol><p class="scale-note">${s.step ? esc(C.scaleNote) : 'No step is marked this week.'}</p></div>`);
  if (s.recordLine) H.push(`<p class="track"><b>${esc(C.trackLabel)}</b> ${fill(s.recordLine, v)}</p>`);
  H.push(`</section>`);

  // What to do
  let chip = '';
  if (!stale && s.timing === 'deadline') chip = `<span class="chip chip--deadline tone-${tone}">${ICON.clock}${esc(v.daysLeft)}</span>`;
  if (!stale && s.timing === 'until') chip = `<span class="chip chip--until">${fill(C.untilChip, v)}</span>`;
  const items = s.todo.map(t => (override && t.startsWith('Keep your regular buys')) ? M.overridesPause.regular : t);
  if (trim){ items.push(M.trim.todo + (id === 'STAND_DOWN' ? ' ' + M.trim.todoPause : '')); }
  H.push(`<section class="card todo tone-${tone}" aria-labelledby="todo-h"><div class="card-head"><h2 id="todo-h">What to do</h2>${chip}</div>`);
  H.push(`<ol class="steps">${items.map(t => `<li><span>${fill(t, v)}</span></li>`).join('')}</ol>`);
  if (s.todoAfter) H.push(`<p class="after">${fill(s.todoAfter, v)}</p>`);
  if (armed) H.push(`<p class="callout">${ICON.clock}<span>${fill(M.armed.todoNote, v)}</span></p>`);
  if (!amounts && ['ALL_IN','LUMP_IN','BUILD'].includes(id)) H.push(`<p class="personal">${esc(C.personalise).replace('Settings','<a href="/settings">Settings</a>')}</p>`);
  H.push(`</section>`);

  // Why
  const why = s.why.map(t => [t, false]);
  if (id === 'ALL_IN' && f.goldAssisted) why.push([M.gold.why, true]);
  if (armed) why.push([M.armed.why, false]);
  if (trim) why.push([M.trim.why, false]);
  H.push(`<section class="card" aria-labelledby="why-h"><div class="card-head"><h2 id="why-h">Why</h2></div><ul class="bullets">${why.map(([t,flag]) => `<li${flag ? ' class="flag"' : ''}>${fill(t, v)}</li>`).join('')}</ul></section>`);

  // Record
  if (s.record){
    H.push(`<section class="card" aria-labelledby="rec-h"><div class="card-head"><h2 id="rec-h">Has this worked before?</h2></div>`);
    H.push(`<p class="answer"><b>${fill(s.record.answer, v)}</b></p>`);
    if (s.record.tiles && f.history){
      H.push(`<ul class="tiles" aria-describedby="tile-cap">${f.history.map(h => h.pct == null
        ? `<li class="tile tile--open"><span class="yr">${h.year}</span><span class="val">In progress</span></li>`
        : `<li class="tile"><span class="yr">${h.year}</span><span class="val num">+${h.pct}%</span></li>`).join('')}</ul>`);
      H.push(`<p class="tile-cap" id="tile-cap">${esc(s.record.caption)}</p>`);
    }
    let body = s.record.body;
    if (!v.stretchStart) body = body.replace(/ This stretch began in \{stretchStart\} and hasn't finished yet\./, '');
    H.push(`<p class="record-body">${fill(body, v)}</p></section>`);
  }

  // Risk
  H.push(`<section class="card risk" aria-labelledby="risk-h"><div class="card-head">${ICON.warn}<h2 id="risk-h">What could go wrong</h2></div>${s.risk.map(t => `<p>${fill(t, v)}</p>`).join('')}${s.noRiskStrong ? '' : `<p><strong>${esc(C.riskStrong)}</strong></p>`}</section>`);

  // Price
  const pt = parts(new Date(BASE.latestPriceUtc),{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  H.push(`<section class="price" aria-label="Bitcoin today"><div class="price-row"><span class="price-label">Bitcoin today</span><span class="price-val num">${usd(BASE.latestPriceUsd)}</span><span class="price-time">${pt.weekday}, ${pt.month} ${pt.day}, ${pt.hour}:${pt.minute} ${pt.dayPeriod.toLowerCase()}</span></div><p class="price-note">${esc(C.priceNote)}</p></section>`);

  // Evidence link
  H.push(`<a class="evidence" href="/evidence"><span><span class="t">${esc(C.evidenceLink)}</span><span class="s">Charts, the rules, and every past signal.</span></span>${ICON.arrow}</a>`);

  $('main').innerHTML = H.join('');
  $('footer-text').textContent = C.footer;
  document.title = 'This week · BTC Friday';
}

const sel = $('dev-state');
for (const s of DECK.states){ const o = document.createElement('option'); o.value = s.id; o.textContent = s.label; sel.appendChild(o); }
sel.value = params.get('state') || 'ALL_IN';
for (const k of ['amounts','trim','armed','override','stale']) if (params.get(k) === '1') $('dev-'+k).checked = true;
document.querySelectorAll('.devbar select, .devbar input').forEach(el => el.addEventListener('change', render));
render();
</script>
